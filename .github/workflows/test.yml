# Generated: the tests of the package on every push and pull request (and before a release). Do not edit, the next
# release replaces it. The tests need no network: the API is faked.
name: Tests

on:
  push:
    branches: ["**"]  # not the tags: release.yml runs the tests of a tag itself
  pull_request:
  workflow_call:

permissions:
  contents: read

# a new push of the ref cancels the run of the previous one (called by release.yml: the group of the tag)
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the SDK github.com/unione-repo/unione-go-sdk 1.3.1 in the Go module proxy
        timeout-minutes: 15
        run: |
          for i in $(seq 1 20); do
            if curl -fsSL -A "release-workflow (github.com/$GITHUB_REPOSITORY)" -o /tmp/sdk "https://proxy.golang.org/github.com/unione-repo/unione-go-sdk/@v/v1.3.1.info"; then
              echo "github.com/unione-repo/unione-go-sdk 1.3.1 is in the Go module proxy"; exit 0
            fi
            echo "github.com/unione-repo/unione-go-sdk 1.3.1 is not in the Go module proxy yet ($i/20)"; sleep 30
          done
          echo "::error::github.com/unione-repo/unione-go-sdk 1.3.1 did not appear in the Go module proxy in 10 min: publish the SDK first"; exit 1
  test:
    needs: sdk
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        v: ["1.21", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.v }}
      - name: Install the dependencies (the mirrors of the registry may serve the SDK some minutes later)
        timeout-minutes: 15
        run: |
          for i in $(seq 1 20); do
            if ( go mod tidy ) > /tmp/install.log 2>&1; then cat /tmp/install.log; exit 0; fi
            cat /tmp/install.log
            if ! grep -qiF 'github.com/unione-repo/unione-go-sdk' /tmp/install.log; then
              echo "::error::the dependencies can not be installed, not because of the SDK github.com/unione-repo/unione-go-sdk: see above"; exit 1
            fi
            echo "the dependencies can not be installed yet: the SDK github.com/unione-repo/unione-go-sdk ($i/20)"; sleep 30
          done
          echo "::error::the dependencies (the SDK) can not be installed in 10 min"; exit 1
      - run: |
          go vet ./... && go test ./...
