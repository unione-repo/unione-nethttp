# Generated: the tests of the package on every push and pull request (and before a release). Do not edit, the next
# release replaces it. The tests need no network: the API is faked.
name: Tests

on:
  push:
    branches: ["**"]  # not the tags: release.yml runs the tests of a tag itself
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        v: ["1.21", "stable"]
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the SDK github.com/unione-repo/unione-go-sdk 1.3.0 in the Go module proxy
        timeout-minutes: 95
        run: |
          for i in $(seq 1 180); do
            if curl -fsSL -A "release-workflow (github.com/$GITHUB_REPOSITORY)" -o /tmp/sdk "https://proxy.golang.org/github.com/unione-repo/unione-go-sdk/@v/v1.3.0.info"; then
              echo "github.com/unione-repo/unione-go-sdk 1.3.0 is in the Go module proxy"; exit 0
            fi
            echo "github.com/unione-repo/unione-go-sdk 1.3.0 is not in the Go module proxy yet ($i/180)"; sleep 30
          done
          echo "::error::github.com/unione-repo/unione-go-sdk 1.3.0 did not appear in the Go module proxy in 90 min: publish the SDK first"; exit 1
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.v }}
      - run: |
          go vet ./... && go test ./...
